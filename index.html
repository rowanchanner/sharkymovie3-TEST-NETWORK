<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Basic Movie Player</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    header {
      height: 48px;
      background: #181818;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    .player-wrap {
      width: 100%;
      height: calc(100vh - 48px);
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>

  <header>Basic Movie Player</header>

  <div class="player-wrap">
    <iframe
      id="moviePlayer"
      src="https://www.vidking.net/embed/movie/936075?color=e50914"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
      allow="fullscreen; autoplay; encrypted-media; picture-in-picture"
    ></iframe>
  </div>

  <script>
    // Blocks popups opened by scripts on YOUR page.
    // This cannot fully control a cross-origin iframe like VidKing.
    window.open = function () {
      console.warn("Popup blocked from parent page");
      return null;
    };

    // Block links on the parent page trying to open new tabs.
    document.addEventListener("click", function (event) {
      const link = event.target.closest("a");

      if (!link) return;

      if (link.target === "_blank") {
        event.preventDefault();
        console.warn("Blocked parent-page new tab:", link.href);
      }
    });

    // If the embedded provider tries to redirect the TOP page,
    // this can sometimes catch it and bring the user back.
    let safeUrl = location.href;

    setInterval(() => {
      if (location.href !== safeUrl) {
        console.warn("Blocked possible top-level redirect");
        location.href = safeUrl;
      }
    }, 500);
  </script>

</body>
</html>
