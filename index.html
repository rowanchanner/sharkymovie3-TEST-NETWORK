<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Basic Movie Player</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    header {
      height: 48px;
      background: #181818;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    .player-wrap {
      position: relative;
      width: 100%;
      height: calc(100vh - 48px);
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    #clickShield {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.01);
      cursor: pointer;
    }

    #shieldMessage {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    #clickShield.off {
      pointer-events: none;
    }

    #shieldMessage.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>

  <header>Basic Movie Player</header>

  <div class="player-wrap">
    <iframe
      id="moviePlayer"
      src="https://www.vidking.net/embed/movie/936075?color=e50914"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
      allow="fullscreen; autoplay; encrypted-media; picture-in-picture"
    ></iframe>

    <div id="clickShield"></div>
    <div id="shieldMessage">Click once to unlock player controls</div>
  </div>

  <script>
    const shield = document.getElementById("clickShield");
    const message = document.getElementById("shieldMessage");

    function armShield() {
      shield.classList.remove("off");
      message.classList.remove("hidden");
      message.textContent = "Click once to unlock player controls";
    }

    function unlockPlayerBriefly() {
      shield.classList.add("off");
      message.classList.add("hidden");

      // Gives you a short window to click play / controls.
      // Then the shield comes back to block ad/popup clicks.
      setTimeout(() => {
        armShield();
      }, 1800);
    }

    shield.addEventListener("click", unlockPlayerBriefly);

    // Blocks popups from this parent page only.
    window.open = function () {
      console.warn("Popup blocked from parent page");
      return null;
    };

    // Try to stop top-level redirects away from your page.
    const safeUrl = location.href;

    setInterval(() => {
      if (location.href !== safeUrl) {
        console.warn("Blocked possible top-level redirect");
        location.href = safeUrl;
      }
    }, 500);
  </script>

</body>
</html>
